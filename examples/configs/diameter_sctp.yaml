# godiam configuration file
# Generated by diameterd --gen-config

# Diameter Identity (must be a valid FQDN)
identity: "e6a58e32ad4a.example.com"

# Diameter Realm
realm: "example.com"

# Listen configuration
listen:
  port: 3868
  enable_tcp: true
  enable_sctp: true

# TLS configuration (optional)
tls:
  enabled: false
  # cert_file: "/etc/diameter/cert.pem"
  # key_file: "/etc/diameter/key.pem"
  # ca_file: "/etc/diameter/ca.pem"
  # verify_peer: true
  # min_version: "1.2"

# Local node configuration
local:
  vendor_id: 0
  product_name: "godiam"
  firmware_revision: 1
  watchdog_interval: 30s
  connect_timeout: 10s
  request_timeout: 30s

# Peer configuration
peers: []
  # - identity: "peer.example.com"
  #   realm: "example.com"
  #   addresses:
  #     - "192.168.1.100"
  #   port: 3868
  #   tls: false
  #   connect_on_start: true
  #   persistent: true

# Supported applications
applications:
  - id: 4
    type: auth
    # Credit-Control Application
  - id: 3
    type: acct
    # Base Accounting Application
  - id: 5
    type: auth
    # Diameter EAP Application
  - id: 16777216
    type: auth
    # 3GPP Cx Application
  - id: 16777238
    type: auth
    # 3GPP Gx Application
  - id: 16777251
    type: auth
    # 3GPP S6a Application
  - id: 6
    type: auth
    # Diameter SIP Application (RFC 4740)

# Extensions
extensions:
  - name: "dbg_msg_dumps"
  - name: "app_cc"
  - name: "app_acct"
  - name: "app_diameap"
  - name: "app_cx"
  - name: "app_gx"
  - name: "app_s6a"
  - name: "app_sip"
  - name: "dbg_monitor"
    config:
      port: 9000
