# freeDiameter peer11 configuration (left side)
# Using freeDiameter implementation

Identity = "peer11.access.realm";
Realm = "access.realm";
Port = 13868;
SecPort = 13869;

TLS_Cred = "/etc/freeDiameter/cert11.pem", "/etc/freeDiameter/privkey11.pem";
TLS_CA = "/etc/freeDiameter/cert11.pem";
TLS_DH_File = "/etc/freeDiameter/dh.pem";

# Connect to freeDiameter dra1
ConnectPeer = "dra1.access.realm" { ConnectTo = "127.0.0.1"; NO_TLS; port = 3868; };

LoadExtension = "/usr/local/lib/freeDiameter/dbg_msg_dumps.fdx" : "0x0080";
LoadExtension = "/usr/local/lib/freeDiameter/test_app.fdx" : "/conf/test_app11.conf";
