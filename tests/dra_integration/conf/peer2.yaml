# godiam Peer2 configuration (right side, connects to dra2)
# Using godiam implementation - sends test messages
identity: "peer2.backend.realm"
realm: "backend.realm"

listen:
  address: "127.0.0.1"
  port: 3872
  enable_tcp: true

local:
  vendor_id: 0
  product_name: "godiam-peer2"
  firmware_revision: 1
  watchdog_interval: 30s
  connect_timeout: 10s
  request_timeout: 30s

# Peer to dra2 (godiam)
peers:
  - identity: "dra2.backend.realm"
    realm: "backend.realm"
    addresses:
      - "127.0.0.1"
    port: 4868
    connect_on_start: true
    persistent: true

# Routing: all messages to dra2
routing:
  relay_enabled: false
  host_routes:
    "dra1.access.realm": "dra2.backend.realm"
  realm_routes:
    "access.realm":
      - "dra2.backend.realm"
    "backend.realm":
      - "dra2.backend.realm"

applications:
  - id: 4
    type: auth
  - id: 3
    type: acct
  - id: 9999
    type: auth

extensions:
  - name: "dbg_msg_dumps"
  - name: "test_app"
    config:
      app_id: 9999
      send_on_start: true
      dest_host: "dra1.access.realm"
      dest_realm: "access.realm"
      count: 1
