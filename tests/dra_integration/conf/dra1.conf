# freeDiameter DRA 1 configuration (left side)
# Using freeDiameter implementation

Identity = "dra1.access.realm";
Realm = "access.realm";
Port = 3868;
SecPort = 3869;

TLS_Cred = "/etc/freeDiameter/cert.pem", "/etc/freeDiameter/privkey.pem";
TLS_CA = "/etc/freeDiameter/cert.pem";
TLS_DH_File = "/etc/freeDiameter/dh.pem";

# Connect to godiam dra2 on the right side
ConnectPeer = "dra2.backend.realm" { ConnectTo = "127.0.0.1"; NO_TLS; port = 4868; };

# Connect to local freeDiameter peers  
ConnectPeer = "peer11.access.realm" { ConnectTo = "127.0.0.1"; NO_TLS; port = 13868; };
ConnectPeer = "peer12.access.realm" { ConnectTo = "127.0.0.1"; NO_TLS; port = 23868; };

LoadExtension = "/usr/local/lib/freeDiameter/dbg_msg_dumps.fdx" : "0x0080";
