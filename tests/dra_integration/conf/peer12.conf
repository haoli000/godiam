# freeDiameter peer12 configuration (left side)
# Using freeDiameter implementation

Identity = "peer12.access.realm";
Realm = "access.realm";
Port = 23868;
SecPort = 23869;

TLS_Cred = "/etc/freeDiameter/cert12.pem", "/etc/freeDiameter/privkey12.pem";
TLS_CA = "/etc/freeDiameter/cert12.pem";
TLS_DH_File = "/etc/freeDiameter/dh.pem";

# Connect to freeDiameter dra1
ConnectPeer = "dra1.access.realm" { ConnectTo = "127.0.0.1"; NO_TLS; port = 3868; };

LoadExtension = "/usr/local/lib/freeDiameter/dbg_msg_dumps.fdx" : "0x0080";
LoadExtension = "/usr/local/lib/freeDiameter/test_app.fdx" : "/conf/test_app12.conf";
