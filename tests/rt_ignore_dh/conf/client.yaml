# Left-side peer configuration (connects directly to dra2)
identity: "peer11.access.realm"
realm: "access.realm"

listen:
  port: 3870
  enable_tcp: true

local:
  vendor_id: 0
  product_name: "godiam-server11"
  firmware_revision: 1
  watchdog_interval: 30s
  connect_timeout: 10s
  request_timeout: 30s

# Peer to dra2
peers:
  - identity: "gw.backend.realm"
    realm: "backend.realm"
    addresses:
      - "127.0.0.20"
    port: 3869
    connect_on_start: true
    persistent: true

applications:
  - id: 4
    type: auth
  - id: 3
    type: acct
  - id: 9999
    type: auth

extensions:
  - name: "dbg_msg_dumps"
  - name: "test_app"
    config:
      app_id: 9999
      send_on_start: true
      dest_host: "gw.backend.realm"
      dest_realm: "backend.realm"
      count: 1
