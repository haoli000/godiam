# Well behaved roaming partner. Sends one request into the core realm and must
# receive an answer that never discloses an internal identity.
identity: "cli.good.realm"
realm: "good.realm"

listen:
  addresses: ["127.0.0.1"]
  port: 3871
  enable_tcp: true

local:
  vendor_id: 0
  product_name: "godiam-partner-good"
  firmware_revision: 1
  watchdog_interval: 30s
  connect_timeout: 10s
  request_timeout: 30s

peers:
  - identity: "dea.edge.realm"
    realm: "edge.realm"
    addresses: ["127.0.0.1"]
    port: 5868
    connect_on_start: true
    persistent: true

routing:
  relay_enabled: false
  realm_routes:
    "core.realm":
      - "dea.edge.realm"

applications:
  - id: 9999
    type: auth

extensions:
  - name: "dbg_msg_dumps"
  - name: "test_app"
    config:
      app_id: 9999
      send_on_start: true
      dest_realm: "core.realm"
      count: 1
