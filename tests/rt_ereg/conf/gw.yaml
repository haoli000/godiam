# DRA Gateway with rt_ereg regex-based routing
identity: "gw.test.realm"
realm: "test.realm"

listen:
  port: 3869
  enable_tcp: true

local:
  vendor_id: 0
  product_name: "godiam-gw"
  firmware_revision: 1
  watchdog_interval: 30s
  connect_timeout: 10s
  request_timeout: 30s

peers:
  - identity: "client.access.realm"
    realm: "access.realm"
    addresses:
      - "127.0.0.11"
    port: 3870
    connect_on_start: false
    persistent: true
  - identity: "server1.backend.realm"
    realm: "backend.realm"
    addresses:
      - "127.0.0.21"
    port: 3871
    connect_on_start: false
    persistent: true
  - identity: "server2.backend.realm"
    realm: "backend.realm"
    addresses:
      - "127.0.0.22"
    port: 3872
    connect_on_start: false
    persistent: true

routing:
  relay_enabled: true
  realm_routes:
    "backend.realm":
      - "server1.backend.realm"
      - "server2.backend.realm"

applications:
  - id: 4
    type: auth
  - id: 9999
    type: auth

extensions:
  - name: "dbg_msg_dumps"
  - name: "rt_ereg"
    config:
      rules:
        - avp: "Destination-Realm"
          pattern: "right\\.side"
          server: "server1.backend.realm"
          score: 200
