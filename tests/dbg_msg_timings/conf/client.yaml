# Client peer - sends test requests
identity: "client.access.realm"
realm: "access.realm"

listen:
  port: 3870
  enable_tcp: true

local:
  vendor_id: 0
  product_name: "godiam-client"
  firmware_revision: 1
  watchdog_interval: 30s
  connect_timeout: 10s
  request_timeout: 30s

peers:
  - identity: "gw.test.realm"
    realm: "test.realm"
    addresses:
      - "127.0.0.10"
    port: 3869
    connect_on_start: true
    persistent: true

routing:
  realm_routes:
    "backend.realm":
      - "gw.test.realm"

applications:
  - id: 4
    type: auth
  - id: 9999
    type: auth

extensions:
  - name: "dbg_msg_dumps"
  - name: "test_app"
    config:
      app_id: 9999
      send_on_start: true
      dest_realm: "backend.realm"
      count: 5
