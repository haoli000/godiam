# Backend server configuration for DRA performance test
# Handles CCR requests and returns CCA responses
identity: "server.backend.realm"
realm: "backend.realm"

listen:
  port: 3868
  enable_tcp: true

local:
  vendor_id: 0
  product_name: "godiam-server"
  firmware_revision: 1
  watchdog_interval: 30s
  connect_timeout: 10s
  request_timeout: 30s

peers_policy:
  allow_unknown: true

routing:
  relay_enabled: false

applications:
  - id: 4
    type: auth

extensions:
  # app_cc handles Credit-Control-Requests
  - name: "app_cc"
  - name: "prom_metrics"
    config:
      port: 9091
# Debug extensions - uncomment for troubleshooting
#  - name: "dbg_msg_dumps"
