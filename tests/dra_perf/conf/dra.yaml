# DRA (Diameter Routing Agent) configuration for performance test
# Relays messages between client (diameterbench) and backend server
identity: "dra.test.realm"
realm: "test.realm"

listen:
  port: 3869
  enable_tcp: true

local:
  vendor_id: 0
  product_name: "godiam-dra"
  firmware_revision: 1
  watchdog_interval: 30s
  connect_timeout: 10s
  request_timeout: 30s

peers_policy:
  allow_unknown: true

# Backend server peer
peers:
  - identity: "server.backend.realm"
    realm: "backend.realm"
    addresses:
      - "127.0.0.1"
    port: 3868
    connect_on_start: true
    persistent: true

# Routing: relay all messages to backend realm
routing:
  relay_enabled: true
  default_realm: "backend.realm"
  realm_routes:
    "backend.realm":
      - "server.backend.realm"

applications:
  - id: 4
    type: auth

extensions:
  - name: "prom_metrics"
    config:
      port: 9090
# Debug extensions - uncomment for troubleshooting
#  - name: "dbg_msg_dumps"
